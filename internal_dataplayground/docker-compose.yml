version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: life_os_db
    restart: always
    environment:
      # These use the variables from your .env file
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: jobs
      MYSQL_USER: data_playground
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mariadb_data:/var/lib/mysql

  web:
    build: .
    container_name: life_os_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # No passwords here! FastAPI gets them from GCP.
      - GOOGLE_APPLICATION_CREDENTIALS=/app/impactful-post-292301-17bfe2bceb2c.json
      # We tell the app WHERE the DB is, but not the password
      - DB_HOST=db 
    volumes:
      - .:/app
