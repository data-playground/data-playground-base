version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: life_os_db
    restart: always
    environment:
      # These use the variables from your .env file
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: jobs
      MYSQL_USER: data_playground
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mariadb_data:/var/lib/mysql

  web:
    build: .
    container_name: life_os_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # No passwords here! FastAPI gets them from GCP.
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-key.json
      # We tell the app WHERE the DB is, but not the password
      - DB_HOST=db 
    volumes:
      - .:/app

  airflow-init:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.7.1}
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      # Points to the 'db' service we created earlier
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=mysql+mysqlconnector://data_playground:${DB_PASSWORD}@db:3306/airflow
    # This service runs once to set up the DB tables and then stops
    command: version && airflow db init && airflow users create --username admin --firstname Pedro --lastname Mano --role Admin --email data_playground.contact@gmail.com --password ${DB_PASSWORD}
    depends_on:
      - db

  airflow-webserver:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.7.1}
    container_name: life_os_airflow_web
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=mysql+mysqlconnector://data_playground:${DB_PASSWORD}@db:3306/airflow
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - PYTHONPATH=/home/main-server/Github/data-playground-base/google_blogs
    volumes:
      - /home/main-server/airflow/dags:/opt/airflow/dags
      - /home/main-server/airflow/logs:/opt/airflow/logs
      - /home/main-server/Github:/home/main-server/Github
      - /home/main-server/keys:/home/main-server/keys

  airflow-scheduler:
    image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.7.1}
    container_name: life_os_airflow_scheduler
    restart: always
    depends_on:
      - db
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=mysql+mysqlconnector://data_playground:${DB_PASSWORD}@db:3306/airflow
      - PYTHONPATH=/home/main-server/Github/data-playground-base/google_blogs
    volumes:
      - /home/main-server/airflow/dags:/opt/airflow/dags
      - /home/main-server/airflow/logs:/opt/airflow/logs
      - /home/main-server/Github:/home/main-server/Github
      - /home/main-server/keys:/home/main-server/keys