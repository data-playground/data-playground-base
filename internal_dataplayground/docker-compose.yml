# docker-compose.yml
services:

  db:
    image: mariadb:10.11
    container_name: life_os_db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: jobs
      MYSQL_USER: data_playground
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build: .
    container_name: life_os_web
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/impactful-post-292301-17bfe2bceb2c.json
      - APP_ENV=production
      - ML_SERVICE_URL=http://ml-service:8001
      - MEDIA_RECOMMEND_AI=false
    volumes:
      - .:/app

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: life_os_airflow_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://data_playground:${DB_PASSWORD}@db:3306/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - _AIRFLOW_DB_MIGRATE=true
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=${AIRFLOW_SECRET_KEY}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Pedro \
          --lastname Admin \
          --role Admin \
          --email data_playground.contact@gmail.com \
          --password "${AIRFLOW_SECRET_KEY}" || true
        echo "Airflow init complete."
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: life_os_airflow_web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://data_playground:${DB_PASSWORD}@db:3306/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp-key.json
      - PYTHONPATH=/opt/airflow/dags:/opt/airflow/project
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - ML_SERVICE_URL=http://ml-service:8001
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./${GCP_KEY_FILE}:/opt/airflow/gcp-key.json
      - .:/opt/airflow/project
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: life_os_airflow_scheduler
    restart: always
    depends_on:
      db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=mysql+pymysql://data_playground:${DB_PASSWORD}@db:3306/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__WEBSERVER__SECRET_KEY=${AIRFLOW_SECRET_KEY}
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/airflow/gcp-key.json
      - PYTHONPATH=/opt/airflow/dags:/opt/airflow/project
      - ML_SERVICE_URL=http://ml-service:8001
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./${GCP_KEY_FILE}:/opt/airflow/gcp-key.json
      - .:/opt/airflow/project
    command: scheduler

  ml-service:
    build:
      context: ../ml_service
      dockerfile: Dockerfile
    container_name: life_os_ml
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./ml_model_cache:/app/model_cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s