{# templates/partials/discovery_save_result.html
   Returned by POST /recipes/discover/save after an AI suggestion is saved.
   `recipe` = newly saved Recipe ORM object
#}
<div style="padding:14px 16px;background:rgba(0,201,128,0.07);border:1px solid rgba(0,201,128,0.25);border-radius:8px;display:flex;align-items:center;gap:12px;">
    <span style="font-size:20px;">✓</span>
    <div>
        <div style="font-size:12px;font-weight:500;color:var(--green);margin-bottom:3px;">
            "{{ recipe.title }}" saved to your recipe book.
        </div>
        <a href="/recipes/{{ recipe.id }}"
           style="font-size:10px;color:var(--accent);text-decoration:none;">
            View recipe →
        </a>
    </div>
</div>
