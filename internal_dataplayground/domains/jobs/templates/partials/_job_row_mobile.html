{# templates/partials/_job_row_mobile.html
   Single mobile .job-card-mobile for one job. `job` = Job ORM object.
   Included by both jobs.html (initial page load, inside #jobs-mobile-list)
   and jobs_rows.html (AJAX filter/load-more batches, inside a <template>).
   Not meant to be requested directly.
#}
{% set current = job.latest_status_key or 'NONE' %}
<div class="job-card-mobile"
    data-job-id="{{ job.ID }}"
    data-score="{{ job.fit_score }}"
    data-remote="{{ job.remote | lower }}"
    data-status="{{ current }}"
    data-company="{{ job.company_name | lower if job.company_name else '' }}"
    data-postdate="{{ job.search_date.strftime('%Y-%m-%d') if job.search_date else '' }}">

    <div class="job-card-mobile-header">
        <div class="job-card-mobile-score score-badge {% if job.fit_score >= 90 %}score-high{% elif job.fit_score >= 50 %}score-mid{% else %}score-low{% endif %}">
            {{ job.fit_score }}
        </div>
        <div class="job-card-mobile-info">
            <div class="job-card-mobile-title"
                hx-get="/jobs/detail/{{ job.ID }}"
                hx-target="#job-detail-panel"
                hx-swap="innerHTML"
                hx-on::after-request="openDetailPanel()"
                style="cursor:pointer;">
                {{ job.job_title }}
            </div>
            <div class="job-card-mobile-company">{{ job.company_name or '—' }}</div>
        </div>
        {% if job.job_link %}
        <a href="{{ job.job_link }}" target="_blank" rel="noopener noreferrer" class="job-card-mobile-apply">Apply →</a>
        {% endif %}
    </div>

    <div class="job-card-mobile-meta">
        {% if job.remote %}
        <span class="tag tag-remote" style="font-size:9px;padding:2px 7px;">Remote</span>
        {% elif job.location %}
        <span class="tag" style="font-size:9px;padding:2px 7px;">{{ job.location }}</span>
        {% endif %}
        {% if job.search_date %}
        <span style="font-size:9px;color:var(--text-muted);margin-left:auto;">{{ job.search_date.strftime('%b %d') }}</span>
        {% endif %}
    </div>

    <!-- ATS buttons — same hx-post endpoints, scroll horizontally -->
    <div class="ats-buttons" id="ats-mob-{{ job.ID }}"
         hx-target="#ats-mob-{{ job.ID }}"
         hx-swap="outerHTML settle:300ms">
        <button class="ats-btn {% if current == 'APPLIED' %}status-applied{% endif %}"
            hx-post="/ats/log"
            hx-vals='{"job_id":{{ job.ID }},"status":"APPLIED"}'
            onclick="showToast('Marked as Applied')">Applied</button>
        <button class="ats-btn {% if current == 'PHONE_SCREEN' %}status-phone_screen{% endif %}"
            hx-post="/ats/log"
            hx-vals='{"job_id":{{ job.ID }},"status":"PHONE_SCREEN"}'
            onclick="showToast('Marked as Phone Screen')">Phone</button>
        <button class="ats-btn {% if current == 'INTERVIEWING' %}status-interviewing{% endif %}"
            hx-post="/ats/log"
            hx-vals='{"job_id":{{ job.ID }},"status":"INTERVIEWING"}'
            onclick="showToast('Marked as Interviewing')">Interview</button>
        <button class="ats-btn {% if current == 'TECHNICAL_ASSESSMENT' %}status-technical{% endif %}"
            hx-post="/ats/log"
            hx-vals='{"job_id":{{ job.ID }},"status":"TECHNICAL_ASSESSMENT"}'
            onclick="showToast('Marked as Technical')">Technical</button>
        <button class="ats-btn {% if current == 'REJECTED' %}status-rejected{% endif %}"
            hx-post="/ats/log"
            hx-vals='{"job_id":{{ job.ID }},"status":"REJECTED"}'
            onclick="showToast('Marked as Rejected')">Rejected</button>
        <button class="ats-btn {% if current == 'OFFER' %}status-offer{% endif %}"
            hx-post="/ats/log"
            hx-vals='{"job_id":{{ job.ID }},"status":"OFFER"}'
            onclick="showToast('🎉 Offer logged!')">Offer</button>
        <button class="ats-btn {% if current == 'CLOSED' %}status-closed{% endif %}"
            hx-post="/ats/log"
            hx-vals='{"job_id":{{ job.ID }},"status":"CLOSED"}'
            onclick="showToast('Marked as Closed')">Closed</button>
    </div>
</div>
