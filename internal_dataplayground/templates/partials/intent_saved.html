{# templates/partials/intent_saved.html
   HTMX response swapped into #save-result after POST /intent
   `intent` = UserIntent ORM object
#}
<div style="padding:12px 16px;background:rgba(0,201,128,0.07);
            border:1px solid rgba(0,201,128,0.25);border-radius:8px;
            display:flex;align-items:center;gap:10px;margin-top:4px;">
    <span style="color:var(--green);font-size:16px;">✓</span>
    <div>
        <div style="font-size:12px;font-weight:500;color:var(--text-primary);">
            Goals saved
        </div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:2px;">
            {{ intent.fitness_goal.label }} ·
            {{ intent.weekly_workout_days }} workout days/week ·
            {{ intent.cooking_time_label }}
        </div>
    </div>
    <a href="/plan/new" class="btn btn-primary"
       style="margin-left:auto;font-size:10px;padding:5px 14px;">
        Plan This Week →
    </a>
</div>
