{# templates/partials/sidebar_js.html
   Include at the bottom of every standalone page's <script> block, or just before </body>.
   For pages that extend base.html, base.js handles this automatically.
   Provides: setTheme(), toggleSidebar(), applyCollapsed(),
             openMobileSidebar(), closeMobileSidebar()
#}
<script>
// ── Theme ──────────────────────────────────────────────────────────────────────
function setTheme(t, btn) {
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('life-os-theme', t);
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
}

(function () {
    const s = localStorage.getItem('life-os-theme') || 'mixed';
    document.documentElement.setAttribute('data-theme', s);
    document.querySelectorAll('.theme-btn').forEach(b =>
        b.classList.toggle('active', b.textContent.trim().toLowerCase() === s)
    );
})();

// ── Sidebar collapse ───────────────────────────────────────────────────────────
let sidebarCollapsed = localStorage.getItem('sidebar-collapsed') === 'true';

function toggleSidebar() {
    sidebarCollapsed = !sidebarCollapsed;
    localStorage.setItem('sidebar-collapsed', sidebarCollapsed);
    applyCollapsed();
}

function applyCollapsed() {
    const layout = document.getElementById('layout');
    if (!layout) return;
    layout.classList.toggle('sidebar-collapsed', sidebarCollapsed);
    const icon = document.getElementById('collapse-icon');
    if (icon) icon.textContent = sidebarCollapsed ? '▶' : '◀';
}

// Mobile sidebar
function openMobileSidebar() {
    const sidebar = document.getElementById('sidebar');
    const bd = document.getElementById('sidebar-backdrop');
    if (sidebar) sidebar.classList.add('mobile-open');
    if (bd) bd.classList.add('visible');
    // Prevent body scroll while sidebar open
    document.body.style.overflow = 'hidden';
}

function closeMobileSidebar() {
    const sidebar = document.getElementById('sidebar');
    const bd = document.getElementById('sidebar-backdrop');
    if (sidebar) sidebar.classList.remove('mobile-open');
    if (bd) bd.classList.remove('visible');
    document.body.style.overflow = '';
}

// Close mobile sidebar on Escape
document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeMobileSidebar();
});

// Apply on load — desktop only
if (window.innerWidth > 768) {
    applyCollapsed();
}
</script>
