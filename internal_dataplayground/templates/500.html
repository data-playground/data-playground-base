{% extends "base.html" %}
{% block title %}500 — Something went wrong{% endblock %}
{% block page_title %}Error{% endblock %}
{% block content %}
<div style="max-width:560px;margin:60px auto;padding:0 24px;text-align:center;">
    <div style="font-size:48px;margin-bottom:16px;opacity:.3;">⚠</div>
    <div style="font-family:'Syne',sans-serif;font-weight:700;font-size:20px;
                color:var(--text-primary);margin-bottom:10px;">
        Something went wrong
    </div>
    <p style="font-size:12px;color:var(--text-muted);line-height:1.7;margin-bottom:24px;">
        An unexpected error occurred. It has been logged.
        {% if detail %}
        <br><code style="font-size:10px;color:var(--red);">{{ detail }}</code>
        {% endif %}
    </p>
    <a href="/dashboard" class="btn btn-primary" style="text-decoration:none;">
        ← Back to Dashboard
    </a>
</div>
{% endblock %}
